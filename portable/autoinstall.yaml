#cloud-config
autoinstall:
  version: 1

  refresh-installer:
    update: true
    channel: stable/ubuntu-26.04

  locale: en_US.UTF-8
  keyboard:
    layout: de

  source:
    id: ubuntu-desktop-minimal
    search_drivers: false

  identity:
    hostname: portable
    realname: Portable User
    username: portable
    password: "__GENERATED_PASSWORD_HASH__" # GENERATED_PASSWORD

  # Replaced by installer/storage-stage.py during early-commands.
  # BEGIN GENERATED STORAGE
  storage: {}
  # END GENERATED STORAGE

  swap:
    size: 0

  drivers:
    install: false

  codecs:
    install: false

  oem:
    install: false

  packages:
    - btrfs-progs
    - cryptsetup
    - cryptsetup-initramfs
    - grub-efi-amd64-signed
    - shim-signed
    - systemd-zram-generator

  # Bring the freshly installed image current before its first boot. The
  # runtime gate remains authoritative on every later boot.
  updates: all

  debconf-selections: |
    unattended-upgrades unattended-upgrades/enable_auto_updates boolean false

  early-commands:
    - >-
      /bin/sh -c '
      set -eu;
      oldvt="$(fgconsole 2>/dev/null || echo 1)";
      trap "chvt $oldvt >/dev/null 2>&1 || true" EXIT;
      chvt 3;
      TERM=linux /cdrom/portable/installer/storage-stage.py /autoinstall.yaml
      </dev/tty3 >/dev/tty3 2>&1
      '

  late-commands:
    - /cdrom/portable/installer/postinstall.sh /target /run/portable-installer/state.env

  shutdown: poweroff
